[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sfss"
version = "0.3.0"
description = "Secure File Shuttle System foundation"
requires-python = ">=3.9"

[project.optional-dependencies]
ldap = ["ldap3==2.9.1", "pyasn1==0.6.4"]

[project.scripts]
sfss = "sfss.server:main"
sfss-agent = "sfss.agent:main"
sfss-admin = "sfss.operations:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sfss = ["web/*.html", "web/*.css", "web/*.js"]
