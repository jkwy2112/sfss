# Development container variant of clamd.conf.example. 0.0.0.0 is confined by
# Docker's 127.0.0.1 host publication; never install this file on a host.
Foreground yes
User clamav
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
StreamMaxLength 2G
MaxFileSize 2G
MaxScanSize 2G
AlertExceedsMax yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
AlertBrokenExecutables yes
AlertBrokenMedia yes
HeuristicAlerts yes
ScanArchive yes
ScanPE yes
ScanELF yes
ScanPDF yes
ScanOLE2 yes
ScanXMLDOCS yes
MaxRecursion 20
MaxFiles 10000
MaxScanTime 1800000
BytecodeTimeout 60000
PCREMatchLimit 100000
PCRERecMatchLimit 5000
MaxThreads 4
MaxQueue 16
ReadTimeout 3600
CommandReadTimeout 30
SendBufTimeout 500
ExitOnOOM yes
LeaveTemporaryFiles no
FollowFileSymlinks no
FollowDirectorySymlinks no
CrossFilesystems no
SelfCheck 600
EnableShutdownCommand no
EnableReloadCommand no
EnableStatsCommand no
EnableVersionCommand yes
