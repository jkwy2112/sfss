limit_req_zone $binary_remote_addr zone=sfss_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=sfss_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=sfss_client_conn:10m;

server {
    listen 443 ssl http2;
    server_name green-out.sfss.example.internal;
    ssl_certificate /etc/sfss/tls/green-fullchain.pem;
    ssl_certificate_key /etc/sfss/tls/green-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 140m;
    client_header_timeout 15s;
    client_body_timeout 3600s;
    limit_conn sfss_client_conn 32;

    # Outbound system green portal: approved external-release downloads
    # of the user's own submissions only. The green zone never uploads on
    # this system, so no upload or inbound route is exposed here.
    location = /v1/auth/login { limit_except POST { deny all; } limit_req zone=sfss_login burst=5 nodelay; include /etc/nginx/sfss-out-green-proxy.inc; }
    location = /v1/auth/logout { limit_except POST { deny all; } include /etc/nginx/sfss-out-green-proxy.inc; }
    location ~ ^/(green|app\.js|styles\.css|favicon\.ico|health)$ { limit_except GET { deny all; } include /etc/nginx/sfss-out-green-proxy.inc; }
    location ~ ^/v1/(me|outbound)$ { limit_except GET { deny all; } include /etc/nginx/sfss-out-green-proxy.inc; }
    location ~ ^/v1/outbound/[^/]+$ { limit_except GET { deny all; } include /etc/nginx/sfss-out-green-proxy.inc; }
    location ~ ^/v1/outbound/[^/]+/download$ { limit_except GET { deny all; } include /etc/nginx/sfss-out-green-proxy.inc; }
    location / { return 404; }
}
