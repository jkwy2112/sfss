limit_req_zone $ssl_client_fingerprint zone=sfss_gateway_api:10m rate=200r/s;
limit_conn_zone $ssl_client_fingerprint zone=sfss_gateway_conn:10m;

upstream sfss_outbound_core {
    server unix:/run/sfss-outbound/sfss.sock;
    keepalive 64;
}

map $ssl_client_s_dn $sfss_gateway_role {
    default invalid;
    ~(^|,)CN=sfss-green-gateway(,|$) green;
    ~(^|,)CN=sfss-red-gateway(,|$) red;
    ~(^|,)CN=sfss-admin-gateway(,|$) admin;
}

map $sfss_gateway_role $sfss_zone {
    default "";
    green green;
    red red;
}

map $sfss_gateway_role $sfss_gateway_allowed {
    default 1;
    invalid 0;
}

server {
    listen 8443 ssl;
    server_name blue-out-sfss.internal;

    ssl_certificate /etc/sfss/tls/blue-fullchain.pem;
    ssl_certificate_key /etc/sfss/tls/blue-key.pem;
    ssl_client_certificate /etc/sfss/tls/zone-gateway-ca.pem;
    ssl_crl /etc/sfss/tls/zone-gateway-ca.crl.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;

    client_max_body_size 140m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_header_timeout 15s;
    client_body_timeout 3600s;
    limit_conn sfss_gateway_conn 256;
    limit_req zone=sfss_gateway_api burst=500 nodelay;

    if ($sfss_gateway_allowed = 0) { return 403; }

    location / {
        proxy_pass http://sfss_outbound_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-SFSS-Zone $sfss_zone;
        proxy_set_header X-SFSS-Gateway-Role $sfss_gateway_role;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
    }
}
