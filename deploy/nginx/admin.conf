limit_req_zone $binary_remote_addr zone=sfss_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=sfss_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=sfss_client_conn:10m;

server {
    listen 443 ssl http2;
    server_name admin.sfss.example.internal;
    allow 10.20.10.0/24;
    deny all;
    ssl_certificate /etc/sfss/tls/admin-fullchain.pem;
    ssl_certificate_key /etc/sfss/tls/admin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;
    client_header_timeout 15s;
    client_body_timeout 60s;
    limit_conn sfss_client_conn 16;

    location = /v1/auth/login { limit_except POST { deny all; } limit_req zone=sfss_login burst=5 nodelay; include /etc/nginx/sfss-admin-proxy.inc; }
    location = /v1/integrations/wecom/callback { limit_except POST { deny all; } client_max_body_size 64k; include /etc/nginx/sfss-admin-proxy.inc; }
    location ~ ^/(admin|app\.js|styles\.css|favicon\.ico|health|ready|metrics)$ { limit_except GET { deny all; } include /etc/nginx/sfss-admin-proxy.inc; }
    location /v1/ { include /etc/nginx/sfss-admin-proxy.inc; }
    location / { return 404; }
}
